<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title th:text="${post.title}"></title></head>
<body>
<h1 th:text="${post.title}"></h1>
<p th:text="${post.content}"></p>
<a href="/posts">목록으로</a>
<a th:href="@{'/posts/' + ${post.id} + '/edit'}">수정</a>
<form th:action="@{'/posts/' + ${post.id} + '/delete'}" method="post">
    <button type="submit">삭제</button>
</form>
<hr/>
<h2>댓글</h2>
<ul>
    <li th:each="c : ${comments}">
        <span th:text="${c.content}">댓글 내용</span>

        <!-- 수정 버튼: 댓글 수정 폼으로 이동 -->
        <a th:href="@{/comments/{id}/edit(id=${c.id})}">수정</a>

        <!-- 삭제 폼: POST 방식으로 삭제 요청 -->
        <form th:action="@{/comments/{id}/delete(id=${c.id})}" method="post" style="display:inline">
            <button type="submit">삭제</button>
        </form>
    </li>
</ul>
<form th:action="@{'/comments/post/' + ${post.id}}" method="post">
    <input type="text" name="content" placeholder="댓글 입력" required/>
    <button type="submit">등록</button>
</form>
</body>
</html>
