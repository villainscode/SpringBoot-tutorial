<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>게시글 목록</title></head>
<body>
<h1>게시글 목록</h1>
<a href="/posts/new">글 작성</a>
<ul>
    <li th:each="post : ${posts}">
        <a th:href="@{'/posts/' + ${post.id}}" th:text="${post.title}"></a>
    </li>
</ul>

<!-- 페이징 UI -->
<div>
    <span th:if="${currentPage > 1}">
        <a th:href="@{/posts(page=${currentPage - 1})}">이전</a>
    </span>

    <span th:each="i : ${#numbers.sequence(1, totalPages)}">
        <a th:href="@{/posts(page=${i})}"
           th:text="${i}"
           th:classappend="${i == currentPage} ? 'active' : ''">1</a>
    </span>

    <span th:if="${currentPage < totalPages}">
        <a th:href="@{/posts(page=${currentPage + 1})}">다음</a>
    </span>
</div>
</body>
</html>
